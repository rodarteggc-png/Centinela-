<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#0052D4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#0052D4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0" />
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Glow -->
  <circle cx="60" cy="60" r="50" fill="url(#coreGlow)" />

  <!-- Shield Base Outline -->
  <path d="M60,10 L102,28 C102,68 84,98 60,112 C36,98 18,68 18,28 Z" 
        fill="#0b132b" stroke="url(#shieldGrad)" stroke-width="4" stroke-linejoin="round" />

  <!-- Inner Hex Ring -->
  <polygon points="60,26 88,42 88,74 60,90 32,74 32,42" 
           fill="none" stroke="url(#glowGrad)" stroke-width="2.5" opacity="0.85" />

  <!-- Observability Radar / Iris Rings -->
  <circle cx="60" cy="58" r="18" fill="none" stroke="#00F2FE" stroke-width="1.8" stroke-dasharray="4,3" opacity="0.75" />
  <circle cx="60" cy="58" r="10" fill="#001833" stroke="url(#shieldGrad)" stroke-width="2" />
  
  <!-- Central Pulse Core (Eye / Sentinel Aperture) -->
  <circle cx="60" cy="58" r="4.5" fill="#00F2FE" filter="url(#neon)" />

  <!-- Telemetry Pulse Wave passing through -->
  <path d="M26,58 L44,58 L50,45 L56,71 L64,48 L70,64 L76,58 L94,58" 
        fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)" />
</svg>
