# ============================================================
#  Grafana — Fuentes de Datos Auto-provisionadas
#  Centinela — Plataforma de Observabilidad
# ============================================================
apiVersion: 1

deleteDatasources:
  - name: Tempo
    orgId: 1
  - name: Loki
    orgId: 1

datasources:
  # Prometheus — Métricas
  - name: Prometheus
    type: prometheus
    uid: centinela-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: "15s"

  # ClickHouse — PI / Performance Investigator
  # Solo activo con el perfil pi. Requiere el plugin
  # grafana-clickhouse-datasource, instalado con
  # GF_INSTALL_PLUGINS en docker-compose.pi.yml.
  # La contraseña se lee de CLICKHOUSE_PASSWORD del entorno.
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: centinela-clickhouse
    access: proxy
    url: http://clickhouse:8123
    editable: true
    jsonData:
      defaultDatabase: centinela_pi
      username: ${CLICKHOUSE_USER:-centinela_pi}
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
