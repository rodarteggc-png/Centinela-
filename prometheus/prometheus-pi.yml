global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: "centinela"
    environment: "local"

rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "sqlserver"
    scrape_interval: 30s
    static_configs:
      - targets: ["sql-exporter:9399"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: db_type
        replacement: "sqlserver"

  - job_name: "grafana"
    scrape_interval: 30s
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: "centinela-pi-sampler"
    scrape_interval: 3s
    static_configs:
      - targets: ["sampler:9500"]
