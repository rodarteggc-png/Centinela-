# ============================================================
#  Grafana — Fuentes de Datos Auto-provisionadas (Portátil)
#  Centinela — Conexión 100% Localhost
# ============================================================
apiVersion: 1

deleteDatasources:
  - name: Tempo
    orgId: 1
  - name: Loki
    orgId: 1

datasources:
  # 1. Prometheus — Métricas
  - name: Prometheus
    type: prometheus
    uid: centinela-prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: "15s"
