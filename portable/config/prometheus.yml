# ============================================================
#  Prometheus — Centinela Modo Portátil (Windows Localhost)
# ============================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: "centinela"
    environment: "portable-local"

rule_files:
  - "../../prometheus/alerts/foglight_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: "grafana"
    scrape_interval: 30s
    static_configs:
      - targets: ["127.0.0.1:3000"]

  - job_name: "sql-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["127.0.0.1:9399"]
