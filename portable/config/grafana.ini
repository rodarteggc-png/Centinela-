app_mode = production
instance_name = Centinela SQL Server PI

[paths]
data = $__env{GF_PATHS_DATA}
logs = $__env{GF_PATHS_LOGS}
plugins = $__env{GF_PATHS_PLUGINS}
provisioning = $__env{GF_PATHS_PROVISIONING}

[server]
http_port = 3000
http_addr = 127.0.0.1
enable_gzip = true

[security]
admin_user = admin
admin_password = $__env{GF_SECURITY_ADMIN_PASSWORD}
allow_embedding = true
cookie_secure = false

[dashboards]
default_home_dashboard_path = $__env{GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH}

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[help]
enabled = false

[news]
news_feed_enabled = false